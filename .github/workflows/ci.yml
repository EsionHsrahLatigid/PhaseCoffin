name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run heavy plugin builds for manual dispatch
        required: false
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: EsionHsrahLatigid/yup-actions/.github/workflows/plugin-ci.yml@d7746cba582c0a00e6e7f0cdc37ae3b2d38830d8
    permissions:
      contents: read
    with:
      product_name: PhaseCoffin
      product_slug: phasecoffin
      cmake_option_prefix: PHASECOFFIN
      debug_targets_json: '["phasecoffin_dsp_tests"]'
      release_test_targets_json: '["phasecoffin_dsp_tests","phasecoffin_plugin_tests","phasecoffin_editor_tests"]'
      windows_debug_plugins: false
